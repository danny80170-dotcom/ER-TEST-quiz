間接膽紅素升高、LDH 上升，週邊血液抹片可見明顯的紅血球凝集現象。下列敘述何者較適當？", "imageNote": null, "options": {"A": "該病症主要由 IgG 自體抗體媒介，紅血球破壞主要發生在脾臟，首選治療為緊急脾臟切除術。", "B": "該病症之病生理機轉涉及 IgM 抗體與補體結合，其紅血球破壞主要由肝臟的 Kupffer 細胞負責。", "C": "對於此類急性溶血病人，應立即給予高劑量皮質類固醇作為首選治療，預期反應率可達 80%以上。", "D": "若病人因貧血嚴重需輸注紅血球，為了安全起見，應先將血液在室溫下靜置降溫後再輸入。"}}, {"id": 183, "answer": "B", "stem": "西亞返國男子因發燒就醫，診斷為瘧疾。周邊血液薄片如圖。下列何者較適當？", "imageNote": "附圖：周邊血液薄片抹片", "options": {"A": "大部分為 Plasmodium vivax 感染，應給予口服 Chloroquine 與 Primaquine，門診追蹤即可。", "B": "最可能為 severe Plasmodium falciparum malaria，應立即住院並給予 IV Artesunate。", "C": "雖有旅遊史，但僅憑 thin blood film 無法判斷，應待 thick blood film 重複確認後再開始治療。", "D": "若病人有低血糖與腎功能異常，應先以支持性治療為主，待病況穩定後再開始抗瘧藥。"}}, {"id": 184, "answer": "B", "stem": "關於自然災害的描述，下列何者較適當？", "imageNote": null, "options": {"A": "洪水災害下，即使有安全、充足的飲用水供應，急性腸胃炎和腹瀉還是很常見。", "B": "颶風（Hurricane）是自然災害中，可能唯一一種在災後復原期比災害急性期傷亡人數更多的天災。", "C": "自然災害的災後族群面臨的最大、意想不到的健康威脅常常是來自感染急症。", "D": "自然災害的某些常見特徵會加劇傳染病風險，傳染病主要發生在災害急性期。"}}, {"id": 185, "answer": "B", "stem": "關於異常子宮出血原因的敘述，下列何者較適當？", "imageNote": null, "options": {"A": "惡性腫瘤所引起之子宮出血，孕齡婦女比停經後的婦女常見。", "B": "因排卵異常導致不規則出血，停經前婦女較常見。", "C": "相較其他年紀，停經後的婦女較少因為外源性賀爾蒙所引起出血。", "D": "20%的病人出血原因為凝血異常，最常見是血友病（hemophilia）。"}}, {"id": 186, "answer": "C", "stem": "68 歲男性，食道癌接受放射治療後導致食道狹窄，前天進食牛排後出現吞嚥困難與胸悶感。生命徵象穩定，無發燒或皮下氣腫。胸部 X 光未可見異物。下列何者為較適當的下一步處置？", "imageNote": null, "options": {"A": "給予點滴，持續 NPO 並觀察是否自行緩解。", "B": "靜脈給予 Glucagon。", "C": "盡快安排上消化道內視鏡。", "D": "口服給予蛋白水解酶。"}}, {"id": 187, "answer": "B", "stem": "有關於脊椎外傷的臨床處置或徵狀描述，下列何者較適當？", "imageNote": null, "options": {"A": "使用頸圈固定的外傷病人，是初級評估中評估意識及神經學檢查的步驟。", "B": "Brown-Séquard 症候群在病灶處以下喪失同側的運動、本體感覺與震動感覺，在對側則喪失溫覺與痛覺。", "C": "神經性休克通常在受傷後出現脊髓反射活動的暫時喪失或抑制。", "D": "脊椎性休克的病人會出現心搏過緩、低血壓、周邊皮膚溫暖。"}}, {"id": 188, "answer": "C", "stem": "9 個月大的男嬰（體重 9.0 kg）因「發燒、流鼻水 2 天，且今日開始出現呼吸急促」被帶來急診。身體診察發現體溫 38.2℃，心跳 150 次/min，呼吸 55 次/min，血氧飽和度在未給氧下為 94%。病嬰聽診有廣泛性雙側喘鳴音（wheezing）與囉音（crackles），伴隨輕度肋間凹陷。家屬表示這是病嬰第一次發生喘鳴，下列哪一項初始治療計畫較適當？", "imageNote": null, "options": {"A": "立即給予吸入性 Albuterol 並觀察反應。", "B": "給予單劑量口服 Dexamethasone 減輕發炎。", "C": "執行鼻腔抽吸（nasal suction）與維持水分補充。", "D": "開立經驗性口服 Amoxicillin 治療潛在感染。"}}, {"id": 189, "answer": "D", "stem": "52 歲男性，BMI 49 kg/m²，因 2 天來呼吸困難加劇及反應變慢送至急診。家屬表示病人平時鼾聲很大，夜間常出現呼吸中止。無 COPD 病史。到院時生命徵象：血壓 168/96 mmHg，心跳 112 次/min，呼吸 10 次/min，SpO₂ 84%（room air），GCS E3V4M6。身體診察可見短頸、下顎後縮，平躺時呼吸更費力。動脈血氣分析顯示：pH 7.27、PaCO₂ 68 mmHg、PaO₂ 54 mmHg。病人因躁動不安，您要準備後續插管，下列何者為此時較適當的處置策略？", "imageNote": null, "options": {"A": "病人 PaCO₂ 升高最可能代表 COPD 惡化，應先給予足量 Benzodiazepine 鎮靜，再讓病人採平躺 sniffing position 準備插管。", "B": "病態性肥胖病人若需插管，最佳化 preoxygenation 及調整體位相對不重要；需快速完成 rapid-sequence intubation。", "C": "因病人為病態性肥胖，rapid-sequence intubation 為相對禁忌；若非完全昏迷，應避免任何插管準備藥物。", "D": "先將病人置於 ramping position，鎮靜時應從較低劑量開始並逐步 titrate，以避免呼吸抑制與快速去飽和。"}}, {"id": 190, "answer": "C", "stem": "下列關於急性腹痛之敘述，何者較不適當？", "imageNote": null, "options": {"A": "使用 NSAID 類藥物可能會延遲早期腹膜炎的診斷。", "B": "必要時可以使用 metoclopramide 止吐。", "C": "血清乳酸數值正常可以排除急性腸繫膜缺血。", "D": "約有一半的小腸阻塞病人腹部 X 光不會呈現異常。"}}, {"id": 191, "answer": "C", "stem": "25 歲男性，有第一型糖尿病病史，因連續 2 天噁心、嘔吐與多尿被送至急診。身體診察心跳 120 次/min、血壓 95/60 mmHg，且有 Kussmaul respirations 的現象。抽血檢查：血清葡萄糖 480 mg/dL，血清酮體 4.5 mEq/L，靜脈血 pH 7.15，HCO₃⁻ 10 mEq/L，Anion gap 24 mEq/L，血清鉀離子濃度為 2.8 mEq/L。下列處置何者較適當？", "imageNote": null, "options": {"A": "立即給予靜脈胰島素輸注，並同時由靜脈以每小時 20 至 30 mEq 速率補充鉀離子。", "B": "因病人體內總鉀量嚴重缺乏，應優先給予靜脈磷酸鉀（Potassium phosphate），以同時矯正預期的低血磷與低血鉀。", "C": "暫緩給予靜脈胰島素，先由靜脈以每小時 20 至 30 mEq 速率補充鉀離子，直到血清鉀濃度≥ 3.5 mEq/L。", "D": "應優先單獨給予靜脈胰島素以改善酸血症，待血清鉀離子因酸血症緩解而自細胞內釋出後，再評估補鉀。"}}, {"id": 192, "answer": "C", "stem": "關於各部位神經阻斷的手法與藥物選擇，下列敘述何者較適當？", "imageNote": null, "options": {"A": "經腱鞘神經阻斷術（Transthecal / flexor tendon sheath block）相較於傳統手指神經阻斷，能確保遠端指尖獲得更完全的麻醉效果。", "B": "針對大拇指背側的撕裂傷，應施行正中神經阻斷術是最合適的選擇。", "C": "耳部神經阻斷術需於耳廓上下方進針形成環狀阻斷，包含外耳前上側的耳顳神經（auriculotemporal nerve）與後下側的耳大神經（greater auricular nerve）。", "D": "進行手指神經阻斷時，相較於 Bupivacaine 0.5%，若選用含有腎上腺素的 1% Lidocaine，可減緩注射時的疼痛感，麻醉持續時間也會增加。"}}, {"id": 193, "answer": "C", "stem": "55 歲男性，有糖尿病視網膜病變病史，因 2 小時前右眼視野突然視力模糊出現大量黑色漂浮物來急診就醫，否認眼痛或外傷史。身體診察發現右眼視力 0.05，左眼 0.1；兩眼瞳孔反射正常，無結膜充血或角膜混濁。眼底鏡檢查發現無法清楚辨識視網膜與視神經盤結構，視野內可見不規則暗色影像漂浮。下列何者為較可能的診斷？", "imageNote": null, "options": {"A": "Central retinal artery occlusion（中央視網膜動脈阻塞）。", "B": "Central retinal vein occlusion（中央視網膜靜脈阻塞）。", "C": "Vitreous hemorrhage（玻璃體出血）。", "D": "Retinal detachment（視網膜剝離）。"}}, {"id": 194, "answer": "C", "stem": "45 歲男性從塑膠加工廠火災被救出。到院時呈現重度昏迷，血壓 80/50 mmHg，且鼻腔內有明顯碳粒。抽血顯示嚴重乳酸中毒。下列哪一項治療較為適當？", "imageNote": null, "options": {"A": "優先安排高壓氧治療。", "B": "優先給予靜脈注射 Sodium nitrite，能將毒物從粒線體中大量抽出。", "C": "優先給予靜脈注射 Hydroxocobalamin，可結合毒物並由尿液排出。", "D": "優先給予連續靜脈輸注 Deferoxamine，中和酸血症並改善心肌細胞能量代謝。"}}, {"id": 195, "answer": "C", "stem": "68 歲男性，因肺炎併敗血性休克入住外院加護病房，同時接受 Heparin 預防深部靜脈栓塞。今日轉來本院，抽血顯示 platelet 28,000/μL，但轉診資料顯示前一天為 220,000/μL 且無明顯出血表現。重複 CBC 結果相似。周邊血液抹片顯示血小板分布不均，部分呈聚集現象，且檢驗凝血功能正常。下列何者為較適當的初步處置策略？", "imageNote": null, "options": {"A": "懷疑 Heparin-induced thrombocytopenia。", "B": "預防性輸注血小板，以降低出血風險。", "C": "改以 Citrate 抗凝劑試管，重新採血確認血小板數值。", "D": "開始彌漫性血管內凝血評估並給予支持治療。"}}, {"id": 196, "answer": "C", "stem": "65 歲男性因持續性眩暈 12 小時、嘔吐送醫。身體診察見自發性水平眼球震顫。進行 Head Impulse test, Nystagmus, Test of Skew（HINTS plus）檢查以鑑別前庭神經炎或小腦中風。若懷疑為中樞型（central）眩暈，下列敘述何者較適當？", "imageNote": null, "options": {"A": "當病人向左看和向右看時，眼球震顫的快相（fast component）方向始終保持一致（單向眼震 unidirectional nystagmus）。", "B": "進行交替遮眼測試（cover-uncover test / test of Skew）時，兩眼沒有出現任何垂直或對角線的偏移（no vertical Skew）。", "C": "將病人的頭部快速轉向一側，病人的眼睛能持續注視醫師的鼻子，沒有出現代償性的校正眼動（正常 HIT）。", "D": "聽力測試顯示沒有新發生的聽力喪失（no new hearing loss）。"}}, {"id": 197, "answer": "B", "stem": "32 歲男性，無過去病史。在跑步約 5 公里後，突發性右小腿與足部劇烈疼痛，伴隨麻木感。到急診時症狀緩解，摸得到右側膕動脈脈搏（popliteal pulse），但在進行 active ankle plantar flexion 時，足背動脈脈搏（dorsalis pedis pulse）顯著減弱。對側肢體檢查正常。下列敘述何者較適當？", "imageNote": null, "options": {"A": "最可能的診斷為 thromboangiitis obliterans（Buerger’s disease），若病人抽菸應建議戒菸以防止病情惡化。", "B": "此情況屬於 popliteal artery entrapment syndrome，通常需要手術矯正。", "C": "可能是 external iliac artery endofibrosis，通常只需保守治療。", "D": "此為 Takayasu’s arteritis，好發於年輕亞洲男性，需要類固醇治療。"}}, {"id": 198, "answer": "B", "stem": "68 歲男性，酒精性肝硬化，主訴吐紅色鮮血、上腹悶痛、噁心、冒冷汗，體溫 36.4℃、心跳 108 次/min、血壓 102/66 mmHg，Hb 6.1 g/dL，下列處置何者較適當？", "imageNote": null, "options": {"A": "應使用矯正凝血功能藥物。", "B": "應給予輸血紅血球濃厚液。", "C": "目前不需使用靜脈注射抗生素。", "D": "胃鏡檢查前應避免注射 Metoclopramide。"}}, {"id": 199, "answer": "D", "stem": "下列關於各種消化道處置之敘述，何者較不適當？", "imageNote": null, "options": {"A": "吐咖啡渣狀物（coffee ground）的病人，不一定要執行鼻胃管抽吸（aspiration）。", "B": "執行內視鏡止血有困難時，可放置 Sengstaken-Blakemore tube。", "C": "大量腹水引流（大於五公升）時，可能會引發低血鈉和腦病變。", "D": "凝血異常病人（INR>2.5），血小板大於 50,000/μL，腹水引流不需矯正凝血功能。"}}, {"id": 200, "answer": "B", "stem": "34 歲男性，因陰莖持續勃起 8 小時且疼痛加劇至急診就醫。無外傷史，近期曾使用海綿體注射藥物治療勃起功能障礙。身體診察：陰莖海綿體僵硬壓痛，龜頭柔軟。抽吸海綿體的血液氣體分析顯示：pH 7.05、PaO₂ 25 mmHg、PaCO₂ 70 mmHg。下列敘述何者較不適當？", "imageNote": null, "options": {"A": "此病人為缺血性陰莖異常勃起。", "B": "治療方式為尿道海綿體（corpus spongiosum）抽吸與灌洗。", "C": "多用 18 號蝴蝶針插入約 0.5 公分深後進行抽吸。", "D": "抽吸直到出現鮮紅血液後，接著注入 25 mL 冷無菌生理食鹽水，等待 20 分鐘後再抽吸，可重複此步驟。"}}];

    // State management with localStorage
    const STORAGE_KEY = "em_exam_115_state_v1";
    let state = {
      answers: {},      // { qId: 'A' | 'B' | 'C' | 'D' }
      bookmarks: {},    // { qId: true }
      revealed: {},     // { qId: true }
      studyMode: false, // show all answers immediately
      singleMode: false,// single card vs full list
      currentIndex: 0,  // index in filtered list for singleMode
      filter: "all",
      search: "",
      darkMode: false
    };

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          state = { ...state, ...parsed };
        }
      } catch (e) {
        console.error("Failed to load state:", e);
      }
      if (state.darkMode) {
        document.documentElement.setAttribute("data-theme", "dark");
        document.getElementById("theme-toggle").textContent = "☀️ 淺色";
      }
      updateControlButtons();
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          answers: state.answers,
          bookmarks: state.bookmarks,
          studyMode: state.studyMode,
          singleMode: state.singleMode,
          darkMode: state.darkMode
        }));
      } catch (e) {
        console.error("Failed to save state:", e);
      }
    }

    function getFilteredQuestions() {
      const qSearch = state.search.trim().toLowerCase();
      return QUESTIONS.filter(q => {
        // Filter check
        const userAns = state.answers[q.id];
        if (state.filter === "unanswered" && userAns) return false;
        if (state.filter === "wrong" && (!userAns || userAns === q.answer)) return false;
        if (state.filter === "correct" && userAns !== q.answer) return false;
        if (state.filter === "bookmarked" && !state.bookmarks[q.id]) return false;
        if (state.filter === "image" && !q.imageNote) return false;

        // Search check
        if (qSearch) {
          const matchId = String(q.id) === qSearch || `第${q.id}題` === qSearch;
          const matchStem = q.stem.toLowerCase().includes(qSearch);
          const matchOpts = Object.values(q.options).some(opt => opt.toLowerCase().includes(qSearch));
          return matchId || matchStem || matchOpts;
        }
        return true;
      });
    }

    function updateStats() {
      const answeredIds = Object.keys(state.answers);
      const totalAnswered = answeredIds.length;
      let correctCount = 0;
      let wrongCount = 0;

      answeredIds.forEach(id => {
        const q = QUESTIONS.find(item => item.id === Number(id));
        if (q) {
          if (state.answers[id] === q.answer) correctCount++;
          else wrongCount++;
        }
      });

      const rate = totalAnswered > 0 ? Math.round((correctCount / totalAnswered) * 100) : 0;

      document.getElementById("stat-progress").textContent = `已答：${totalAnswered} / ${QUESTIONS.length}`;
      document.getElementById("stat-correct").textContent = `答對：${correctCount}`;
      document.getElementById("stat-wrong").textContent = `答錯：${wrongCount}`;
      document.getElementById("stat-score").textContent = `正確率：${rate}%`;
    }

    function updateControlButtons() {
      const studyBtn = document.getElementById("study-toggle");
      studyBtn.classList.toggle("active", state.studyMode);
      studyBtn.textContent = state.studyMode ? "👁️ 背題模式 (開啟)" : "👁️ 背題模式";

      const modeBtn = document.getElementById("mode-toggle");
      modeBtn.classList.toggle("active", state.singleMode);
      modeBtn.textContent = state.singleMode ? "🎯 單題模式" : "📋 列表模式";
    }

    function createQuestionCard(q) {
      const card = document.createElement("div");
      card.className = "q-card";
      card.id = `q-card-${q.id}`;

      const userAns = state.answers[q.id];
      const isRevealed = state.studyMode || state.revealed[q.id] || Boolean(userAns);
      const isBookmarked = Boolean(state.bookmarks[q.id]);

      // Status tag
      let statusTagHtml = "";
      if (userAns) {
        if (userAns === q.answer) {
          statusTagHtml = `<span class="q-status-tag correct">✓ 答對</span>`;
        } else {
          statusTagHtml = `<span class="q-status-tag wrong">✗ 答錯 (選 ${userAns})</span>`;
        }
      }

      // Image Note
      const imgNoteHtml = q.imageNote
        ? `<div class="q-image-note">🖼️ <strong>${q.imageNote}</strong>（請參照原試題卷第 ${Math.ceil(q.id / 3.3)} 頁附近圖表）</div>`
        : "";

      // Options
      const optsHtml = ["A", "B", "C", "D"].map(key => {
        let btnClass = "opt-btn";
        if (userAns === key) {
          btnClass += (key === q.answer) ? " selected-correct" : " selected-wrong";
        } else if (isRevealed && key === q.answer) {
          btnClass += " reveal-correct";
        }
        return `
          <button class="${btnClass}" data-qid="${q.id}" data-opt="${key}">
            <span class="opt-key">${key}</span>
            <span>${q.options[key]}</span>
          </button>
        `;
      }).join("");

      card.innerHTML = `
        <div class="q-header">
          <div class="q-badge-group">
            <span class="q-number">第 ${q.id} 題</span>
            ${statusTagHtml}
          </div>
          <div class="q-actions">
            <button class="bookmark-btn ${isBookmarked ? "bookmarked" : ""}" data-bookmark="${q.id}">
              ${isBookmarked ? "★ 已收藏" : "☆ 收藏"}
            </button>
            <button class="bookmark-btn" data-reveal="${q.id}">
              ${isRevealed ? "隱藏答案" : "看答案"}
            </button>
          </div>
        </div>
        <div class="q-stem">${q.stem}</div>
        ${imgNoteHtml}
        <div class="options-list">${optsHtml}</div>
        <div class="q-footer" style="display: ${isRevealed ? "flex" : "none"};">
          <span>官方公布答案：<strong class="ans-badge">${q.answer}</strong></span>
          ${userAns ? `<button class="bookmark-btn" data-clear="${q.id}">重做此題</button>` : ""}
        </div>
      `;

      return card;
    }

    function render() {
      const filtered = getFilteredQuestions();
      const container = document.getElementById("questions-container");
      const singleNav = document.getElementById("single-nav");
      const filteredCountEl = document.getElementById("filtered-count");

      filteredCountEl.textContent = `共 ${filtered.length} 題`;
      container.innerHTML = "";

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <p style="font-size: 1.1rem; font-weight: 600; margin-bottom: 0.4rem;">找不到符合條件的題目</p>
            <p style="font-size: 0.9rem;">請嘗試調整篩選條件或清除搜尋關鍵字。</p>
          </div>
        `;
        singleNav.style.display = "none";
      } else if (state.singleMode) {
        if (state.currentIndex >= filtered.length) state.currentIndex = 0;
        if (state.currentIndex < 0) state.currentIndex = filtered.length - 1;
        const currentQ = filtered[state.currentIndex];
        container.appendChild(createQuestionCard(currentQ));

        singleNav.style.display = "flex";
        document.getElementById("single-counter").textContent = `${state.currentIndex + 1} / ${filtered.length} (第 ${currentQ.id} 題)`;
      } else {
        singleNav.style.display = "none";
        const fragment = document.createDocumentFragment();
        filtered.forEach(q => {
          fragment.appendChild(createQuestionCard(q));
        });
        container.appendChild(fragment);
      }

      renderSidebar(filtered);
      updateStats();
    }

    function renderSidebar(filtered) {
      const grid = document.getElementById("q-grid");
      grid.innerHTML = "";
      const fragment = document.createDocumentFragment();

      filtered.forEach((q, idx) => {
        const btn = document.createElement("button");
        btn.className = "grid-btn";
        const userAns = state.answers[q.id];
        if (userAns) {
          btn.classList.add(userAns === q.answer ? "correct" : "wrong");
        }
        if (state.bookmarks[q.id]) {
          btn.classList.add("bookmarked");
        }
        if (state.singleMode && idx === state.currentIndex) {
          btn.classList.add("current");
        }
        btn.textContent = q.id;
        btn.addEventListener("click", () => {
          if (state.singleMode) {
            state.currentIndex = idx;
            render();
            window.scrollTo({ top: 0, behavior: "smooth" });
          } else {
            const target = document.getElementById(`q-card-${q.id}`);
            if (target) target.scrollIntoView({ behavior: "smooth" });
          }
        });
        fragment.appendChild(btn);
      });

      grid.appendChild(fragment);
    }

    // Event Delegation for Question Cards
    document.getElementById("questions-container").addEventListener("click", (e) => {
      const optBtn = e.target.closest(".opt-btn");
      if (optBtn) {
        const qId = Number(optBtn.dataset.qid);
        const opt = optBtn.dataset.opt;
        state.answers[qId] = opt;
        saveState();
        render();
        return;
      }

      const bookmarkBtn = e.target.closest("[data-bookmark]");
      if (bookmarkBtn) {
        const qId = Number(bookmarkBtn.dataset.bookmark);
        if (state.bookmarks[qId]) delete state.bookmarks[qId];
        else state.bookmarks[qId] = true;
        saveState();
        render();
        return;
      }

      const revealBtn = e.target.closest("[data-reveal]");
      if (revealBtn) {
        const qId = Number(revealBtn.dataset.reveal);
        state.revealed[qId] = !state.revealed[qId];
        render();
        return;
      }

      const clearBtn = e.target.closest("[data-clear]");
      if (clearBtn) {
        const qId = Number(clearBtn.dataset.clear);
        delete state.answers[qId];
        delete state.revealed[qId];
        saveState();
        render();
        return;
      }
    });

    // Top bar controls
    document.getElementById("search-input").addEventListener("input", (e) => {
      state.search = e.target.value;
      state.currentIndex = 0;
      render();
    });

    document.getElementById("filter-select").addEventListener("change", (e) => {
      state.filter = e.target.value;
      state.currentIndex = 0;
      render();
    });

    document.getElementById("study-toggle").addEventListener("click", () => {
      state.studyMode = !state.studyMode;
      updateControlButtons();
      saveState();
      render();
    });

    document.getElementById("mode-toggle").addEventListener("click", () => {
      state.singleMode = !state.singleMode;
      state.currentIndex = 0;
      updateControlButtons();
      saveState();
      render();
    });

    document.getElementById("reset-btn").addEventListener("click", () => {
      if (confirm("確定要清除所有作答紀錄嗎？（收藏標記將會保留）")) {
        state.answers = {};
        state.revealed = {};
        saveState();
        render();
      }
    });

    document.getElementById("theme-toggle").addEventListener("click", () => {
      state.darkMode = !state.darkMode;
      if (state.darkMode) {
        document.documentElement.setAttribute("data-theme", "dark");
        document.getElementById("theme-toggle").textContent = "☀️ 淺色";
      } else {
        document.documentElement.removeAttribute("data-theme");
        document.getElementById("theme-toggle").textContent = "🌙 深色";
      }
      saveState();
    });

    // Single mode navigation
    document.getElementById("prev-btn").addEventListener("click", () => {
      state.currentIndex--;
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    document.getElementById("next-btn").addEventListener("click", () => {
      state.currentIndex++;
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    // Keyboard shortcuts in Single Mode
    window.addEventListener("keydown", (e) => {
      if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
      if (!state.singleMode) return;

      const filtered = getFilteredQuestions();
      if (filtered.length === 0) return;
      const currentQ = filtered[state.currentIndex];

      if (e.key === "ArrowLeft") {
        state.currentIndex--;
        render();
      } else if (e.key === "ArrowRight") {
        state.currentIndex++;
        render();
      } else if (["1", "a", "A"].includes(e.key)) {
        state.answers[currentQ.id] = "A";
        saveState();
        render();
      } else if (["2", "b", "B"].includes(e.key)) {
        state.answers[currentQ.id] = "B";
        saveState();
        render();
      } else if (["3", "c", "C"].includes(e.key)) {
        state.answers[currentQ.id] = "C";
        saveState();
        render();
      } else if (["4", "d", "D"].includes(e.key)) {
        state.answers[currentQ.id] = "D";
        saveState();
        render();
      }
    });

    // Initialize
    loadState();
    render();
  </script>
</body>
</html>
